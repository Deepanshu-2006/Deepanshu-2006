name: Refresh profile cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/data
          gh api graphql \
            -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date weekday contributionCount color}}}}}}' \
            -f login='Deepanshu-2006' \
            --jq '.data.user.contributionsCollection.contributionCalendar' \
            > .github/data/contributions.json
      - name: Fetch language statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/data
          : > /tmp/languages.tsv
          for repo in $(gh api --paginate "users/Deepanshu-2006/repos?per_page=100&type=owner" --jq '.[] | select(.fork|not) | .name'); do
            gh api "repos/Deepanshu-2006/$repo/languages" --jq 'to_entries[] | [.key,.value] | @tsv' >> /tmp/languages.tsv
          done
          awk -F '\t' '{ totals[$1] += $2 } END { for (language in totals) print language "\t" totals[language] }' /tmp/languages.tsv | sort -t $'\t' -k2,2nr | head -5 | awk -F '\t' 'BEGIN { printf "{" } { if (n++) printf ","; printf "\"%s\":%s", $1, $2 } END { print "}" }' > .github/data/languages.json
      - name: Install renderer dependencies
        run: python -m pip install --quiet fonttools
      - name: Render SVG cards
        run: python scripts/render_profile.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data cards
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
